<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- T-Shirt Back Shape -->
  <g fill="#f0f0f0" stroke="#cccccc" stroke-width="1.5">
    <!-- Main body -->
    <path d="M100,80 L60,100 L20,180 L80,200 L80,420 L320,420 L320,200 L380,180 L340,100 L300,80 
             C290,110 270,130 250,140 C240,145 230,148 220,150 C215,151 210,152 200,152 
             C190,152 185,151 180,150 C170,148 160,145 150,140 
             C130,130 110,110 100,80 Z"/>
    <!-- Left sleeve -->
    <path d="M100,80 L60,100 L20,180 L80,200 L80,160 C90,140 95,110 100,80 Z"/>
    <!-- Right sleeve -->
    <path d="M300,80 L340,100 L380,180 L320,200 L320,160 C310,140 305,110 300,80 Z"/>
    <!-- Back collar (simple curve) -->
    <path d="M155,80 C165,78 180,77 200,77 C220,77 235,78 245,80 C250,88 252,96 250,104 C240,108 220,110 200,110 C180,110 160,108 150,104 C148,96 150,88 155,80 Z" fill="#e0e0e0"/>
  </g>
  <!-- Subtle stitch lines -->
  <g fill="none" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6">
    <line x1="80" y1="200" x2="80" y2="420"/>
    <line x1="320" y1="200" x2="320" y2="420"/>
    <line x1="80" y1="420" x2="320" y2="420"/>
    <!-- Center back seam -->
    <line x1="200" y1="110" x2="200" y2="420"/>
  </g>
  <!-- Back label indicator -->
  <rect x="185" y="90" width="30" height="16" rx="2" fill="#e8e8e8" stroke="#cccccc" stroke-width="0.8"/>
  <text x="200" y="101" text-anchor="middle" font-size="6" fill="#999" font-family="Arial">BACK</text>
</svg>
